[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarwiki"
version = "0.1.0"
description = "Academic knowledge wiki builder"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pyzotero>=1.5",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "mcp>=1.0",
]

[project.scripts]
scholarwiki = "scholarwiki.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scholarwiki*"]
